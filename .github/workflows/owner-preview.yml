name: Private owner preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'package*.json'
      - '.dockerignore'
      - 'compose.owner-preview.yml'
      - 'compose.preview-small.yml'
      - 'compose.mvp.yml'
      - 'playwright.mvp.config.ts'
      - 'tests/mvp_browser/**'
      - 'tests/fixtures/mvp/**'
      - 'deploy/owner-preview/**'
      - 'scripts/owner_preview.py'
      - 'scripts/check_owner_preview.py'
      - '.github/workflows/owner-preview.yml'
permissions:
  contents: read
jobs:
  synthetic-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate disposable preview credentials
        id: prepare
        run: python -m scripts.owner_preview prepare --origin https://owner-preview.example.test
      - name: Build and start isolated production-server preview
        run: python -m scripts.owner_preview up
      - name: Verify non-root standalone runtime
        run: |
          docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml -f compose.preview-small.yml exec -T web node -e "const assert=require('node:assert'); assert.notEqual(process.getuid(),0); assert.equal(process.env.NODE_ENV,'production'); assert(!require('node:fs').existsSync('/app/apps/web/src'));"
      - name: Owner gate, static assets, roles, origin and secure-cookie checks
        run: python -m scripts.check_owner_preview
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install synthetic browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Full MVP on the constrained production server
        env:
          MVP_BASE_URL: http://127.0.0.1:3080
          MVP_OWNER_PASSWORD_FILE: output/owner-preview/owner-password.txt
        run: |
          # HTTPS-origin/cookie checks above remain independent. Browser smoke
          # uses only the disposable CI loopback origin behind the owner gate.
          CIQ_WEB_ORIGIN=http://127.0.0.1:3080 docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml -f compose.preview-small.yml -f compose.mvp.yml up --no-build --pull never --no-deps --detach --wait api web
          docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml -f compose.preview-small.yml -f compose.mvp.yml exec -T api .venv/bin/python -m ciq_api.seed
          npm run test:mvp
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
      - name: Restore full MVP backup and restart disposable preview
        env:
          # Match the bounded loopback browser origin selected in the step above.
          # The separate HTTPS-origin and secure-cookie checks already ran.
          CIQ_WEB_ORIGIN: http://127.0.0.1:3080
        run: python -m scripts.check_mvp_recovery --stack preview --restart-preview-ci
      - name: Verify saved workflow through browser after restart
        env:
          MVP_BASE_URL: http://127.0.0.1:3080
          MVP_OWNER_PASSWORD_FILE: output/owner-preview/owner-password.txt
          MVP_RECOVERY_CHECKPOINT: output/owner-preview/recovery-checkpoint.json
        run: npx playwright test -c playwright.mvp.config.ts tests/mvp_browser/recovery.spec.ts
      - name: Failure diagnostics
        if: failure() && steps.prepare.outcome == 'success'
        run: docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml -f compose.preview-small.yml logs --tail 40 web api migrate gateway
      - name: Stop only disposable preview stack
        if: always() && steps.prepare.outcome == 'success'
        run: docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml -f compose.preview-small.yml down --volumes
