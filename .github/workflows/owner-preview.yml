name: Private owner preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'package*.json'
      - '.dockerignore'
      - 'compose.owner-preview.yml'
      - 'deploy/owner-preview/**'
      - 'scripts/owner_preview.py'
      - 'scripts/check_owner_preview.py'
      - '.github/workflows/owner-preview.yml'
permissions:
  contents: read
jobs:
  synthetic-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate disposable preview credentials
        id: prepare
        run: python -m scripts.owner_preview prepare --origin https://owner-preview.example.test
      - name: Build and start isolated production-server preview
        run: python -m scripts.owner_preview up
      - name: Verify non-root standalone runtime
        run: |
          docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml exec -T web node -e "const assert=require('node:assert'); assert.notEqual(process.getuid(),0); assert.equal(process.env.NODE_ENV,'production'); assert(!require('node:fs').existsSync('/app/apps/web/src'));"
      - name: Owner gate, static assets, roles, origin and secure-cookie checks
        run: python -m scripts.check_owner_preview
      - name: Failure diagnostics
        if: failure() && steps.prepare.outcome == 'success'
        run: docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml logs --tail 40 web api migrate gateway
      - name: Stop only disposable preview stack
        if: always() && steps.prepare.outcome == 'success'
        run: docker compose --env-file .env.owner-preview.local -f compose.owner-preview.yml down --volumes
