name: Product foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ciq-disposable-agent-ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
      - name: Fake-only agent crash, concurrency and PostgreSQL ledger checks
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ciq-disposable-agent-ledger@127.0.0.1:5432/postgres
        run: |
          uv sync --project apps/api --frozen
          uv run --project apps/api pytest apps/api/tests/test_agent_contracts.py apps/api/tests/test_agent_source_mapping.py apps/api/tests/test_agent_ledger.py apps/api/tests/test_agent_executor.py apps/api/tests/test_agent_executor_ledger.py apps/api/tests/test_agent_admission.py apps/api/tests/test_agent_admission_ledger.py
      - name: Populated encrypted agent-ledger restore and duplicate-submission guards
        env:
          CIQ_AGENT_RECOVERY_CONTAINER: ${{ job.services.postgres.id }}
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ciq-disposable-agent-ledger@127.0.0.1:5432/postgres
        run: uv run --project apps/api python -m pytest apps/api/tests/test_agent_ledger_recovery.py
      - name: Actual restricted controller commands and independent receipt observation
        env:
          CIQ_AGENT_CONTROLLER_TEST: '1'
          TEST_DATABASE_URL: postgresql+psycopg://postgres:ciq-disposable-agent-ledger@127.0.0.1:5432/postgres
        run: uv run --project apps/api pytest apps/api/tests/test_agent_controller_capture.py apps/api/tests/test_agent_controller_reservation.py apps/api/tests/test_agent_receipt_verifier.py
  agent-transport-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
      - name: Separate fake transport with no database, provider SDK or network
        env:
          CIQ_AGENT_TRANSPORT_TEST: '1'
        run: |
          uv sync --project apps/api --frozen
          uv run --project apps/api python scripts/test_agent_transport_isolation.py
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
      - name: Existing deterministic regression suite
        run: |
          uv sync --frozen --extra dev
          uv run pytest
          uv run ruff check .
          uv run python -m scripts.export_synthetic_cases
          git diff --exit-code -- apps/api/src/ciq_api/fixtures/cases.json
      - name: Product dependencies
        run: |
          uv sync --project apps/api --frozen
          npm ci
      - name: Isolated domain wheel boundary
        run: uv run python scripts/check_domain_package.py
      - name: Offline membership connection policy
        run: PYTHONPATH=apps/membership/src:apps/api/src uv run --project apps/api pytest apps/membership/tests/test_connection.py apps/membership/tests/test_probe_validation.py
      - name: Disposable supervisor process containment
        timeout-minutes: 16
        run: make product-supervisor-containment
      - name: Contract drift, types and build
        run: |
          make product-contracts
          git diff --exit-code -- packages/contracts/openapi.json packages/api-client/src/schema.d.ts
          npm run typecheck
          npm run test:client
          npm run lint
          npm run build
      - name: Start isolated product stack
        run: make product-up
      - name: API and PostgreSQL integration
        run: make product-test
      - name: Browser smoke
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Offline source API-to-UI integration
        run: make product-test-source-ui
      - name: Synthetic MVP human workflows
        timeout-minutes: 8
        run: |
          docker compose --env-file .env.product.local -f compose.product.yml -f compose.mvp.yml up --no-build --pull never --no-deps --detach --wait api web
          docker compose --env-file .env.product.local -f compose.product.yml -f compose.mvp.yml exec -T api .venv/bin/python -m ciq_api.seed
          npm run test:mvp
      - name: Failure diagnostics
        if: failure()
        run: make product-logs
      - name: Stop stack
        if: always()
        run: make product-down
  database-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ciq-disposable-catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'
      - name: Disposable PostgreSQL catalog and privilege regression
        env:
          CIQ_CATALOG_TEST: '1'
        run: |
          uv sync --project apps/api --frozen
          uv run --project apps/api pytest tests/integration/test_composition_database_catalog.py
