[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cashlessiq-api"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.16,<2",
  "cashlessiq-domain==0.1.0",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
snowflake = [
    "snowflake-connector-python>=3.18,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2.14.0",
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ciq_api"]

[tool.uv.sources]
cashlessiq-domain = { path = "../../packages/domain" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
